<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Elvate Admin Console</title>
    <link rel="icon" type="image/png" href="./assets/mascot/elvate_headset_enhanced.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./admin.css?v=react-minimal-v1" />
    <script src="./admin-config.js"></script>
    <script src="./builtin-courses.js"></script>
    <!-- React 18 & htm (Local vendor with CDN fallbacks) -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    <script src="./vendor/htm.umd.js"></script>
    <script>
      // CDN Fallbacks in case local vendor is not present
      if (typeof React === 'undefined') {
        document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
      }
      if (typeof ReactDOM === 'undefined') {
        document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
      }
      if (typeof htm === 'undefined') {
        document.write('<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"><\/script>');
      }
    </script>
    <script src="./admin.js?v=react-minimal-v1" defer></script>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="loader-spinner"></div>
        <span>Loading console...</span>
      </div>
    </div>
  </body>
</html>
