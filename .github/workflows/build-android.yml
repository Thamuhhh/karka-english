name: Build Karka Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npx tsc --noEmit

      - name: Prebuild Android project
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Target real phone ARM architectures to shrink APK
        run: |
          if grep -q '^reactNativeArchitectures=' android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
          else
            echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> android/gradle.properties
          fi
          grep '^reactNativeArchitectures=' android/gradle.properties

      - name: Build release APK
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Ensure APK is signed and named
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          mkdir -p release-apk
          cp "$APK_PATH" release-apk/Karka-English.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if ! "$APKSIGNER" verify release-apk/Karka-English.apk >/dev/null 2>&1; then
            keytool -genkeypair -v -noprompt -keystore /tmp/karka-ci.keystore -alias karka -keyalg RSA -keysize 2048 -validity 10000 -storepass karka123 -keypass karka123 -dname "CN=Karka, OU=App, O=Karka, L=Chennai, S=TN, C=IN"
            "$APKSIGNER" sign --ks /tmp/karka-ci.keystore --ks-pass pass:karka123 --key-pass pass:karka123 release-apk/Karka-English.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karka-English-APK
          path: release-apk/Karka-English.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk release-apk/Karka-English.apk --clobber
          else
            gh release create latest-apk release-apk/Karka-English.apk \
              --title "Karka English Latest APK" \
              --notes "Automated Android APK build for Karka English (includes all 66 offline lecture audio clips)."
          fi
